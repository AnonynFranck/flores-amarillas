name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; no se cancela la que esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # El formato es un aviso, no una barrera: una coma que falte en un
      # mensaje escrito a mano no debe impedir que el regalo se publique.
      # Para arreglarlo en local: npm run format
      - name: Revisar formato (no bloquea)
        continue-on-error: true
        run: npm run format:check

      # Esto si bloquea: comprueba que cada foto y cada cancion existen.
      - run: npm test

  compilar:
    name: Compilar
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    name: Publicar
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
